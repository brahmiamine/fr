name: Import licensed prosody recordings

on:
  push:
    branches: [feat/real-french-prosody-bank]
    paths:
      - scripts/import-prosody-recordings.sh
      - .github/workflows/import-prosody-recordings.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audio tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download and cut licensed source recordings
        run: bash scripts/import-prosody-recordings.sh

      - name: Commit generated recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/prosody/prosody_real_*.ogg docs/prosody-audio-analysis.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: import licensed prosody recordings"
          git push
