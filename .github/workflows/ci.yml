name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install audio tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build licensed prosody audio bank
        run: bash scripts/import-prosody-recordings.sh
      - name: Upload generated prosody recordings
        uses: actions/upload-artifact@v4
        with:
          name: prosody-recordings
          path: |
            public/audio/prosody/prosody_real_*.ogg
            docs/prosody-audio-analysis.txt

      - name: Persist generated recordings on the PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/prosody/prosody_real_*.ogg docs/prosody-audio-analysis.txt
          if git diff --cached --quiet; then
            echo "Audio files already versioned"
            exit 0
          fi
          git commit -m "chore: add licensed prosody recordings"
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
